spring:
  application.name: dpw-fms
  lifecycle.timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  data.redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
dpwfms:
  automation:
    evaluation-interval-ms: ${AUTOMATION_EVALUATION_INTERVAL_MS:30000}
    terminal-timezone: ${TERMINAL_TIMEZONE:Asia/Dubai}
  telemetry.freshness-seconds: ${TELEMETRY_FRESHNESS_SECONDS:60}
  dispatch.ack-timeout-seconds: ${DISPATCH_ACK_TIMEOUT_SECONDS:15}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
  map:
    provider: ${MAP_PROVIDER:offline}
    google-key-reference: ${GOOGLE_MAPS_KEY_REFERENCE:}
    mapbox-token-reference: ${MAPBOX_TOKEN_REFERENCE:}
  kernel:
    enabled: ${KERNEL_ENABLED:false}
    endpoint: ${KERNEL_ENDPOINT:}
  security.sensitive-rate-per-minute: ${SENSITIVE_RATE_PER_MINUTE:30}
