services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: "${DB_NAME:-dpw_fms}", POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}", POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    networks: [backend]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Set RABBITMQ_USER in .env}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}"}
    ports: ["127.0.0.1:15672:15672"]
    networks: [backend]
  mosquitto:
    image: eclipse-mosquitto:2
    volumes: [./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    ports: ["127.0.0.1:1883:1883"]
    networks: [backend]
  api:
    build: .
    environment: {SPRING_PROFILES_ACTIVE: prod, DB_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:-dpw_fms}", DB_USER: "${DB_USER}", DB_PASSWORD: "${DB_PASSWORD}", REDIS_HOST: redis, RABBITMQ_HOST: rabbitmq, RABBITMQ_USER: "${RABBITMQ_USER}", RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}", DPWFMS_LOCAL_USERNAME: "${DPWFMS_LOCAL_USERNAME}", DPWFMS_LOCAL_PASSWORD: "${DPWFMS_LOCAL_PASSWORD}", CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"}
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:8080:8080"]
    networks: [backend, frontend]
  web:
    build: ./fms-web
    depends_on: [api]
    ports: ["3000:80"]
    networks: [frontend]
networks: {backend: {internal: true}, frontend: {}}
volumes: {postgres-data: {}}
